<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo en Línea</title>
  <!-- Estilos visuales de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container my-5">
    <h1 class="text-center mb-4">Catálogo de Productos</h1>

    <!-- Controles de Filtros -->
    <div class="row g-3 mb-4 bg-white p-3 rounded shadow-sm">
      <div class="col-md-4">
        <label class="form-label fw-bold">Filtrar por Marca:</label>
        <select id="filtroMarca" class="form-select">
          <option value="">Todas las marcas</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-bold">Filtrar por Categoría:</label>
        <select id="filtroCategoria" class="form-select">
          <option value="">Todas las categorías</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-bold">Precio Máximo ($): <span id="precioValor">100</span></label>
        <input type="range" id="filtroPrecio" class="form-range" min="0" max="100" value="100" step="1">
      </div>
    </div>

    <!-- Lista de tarjetas de productos -->
    <div class="row" id="contenedorProductos"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
